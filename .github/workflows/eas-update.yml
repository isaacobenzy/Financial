name: EAS Update OTA (optional)

# Optional GitHub Actions OTA publish (needs secrets.EXPO_TOKEN).
# Primary path: .eas/workflows/publish-preview-update.yml (EAS Workflows).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
          - development
      message:
        description: Update message
        required: false
        default: OTA update

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require EXPO_TOKEN for GitHub Actions path
        id: expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub Actions secret EXPO_TOKEN — skipping."
            echo "OTA updates are published by EAS Workflows (publish-preview-update.yml)."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: steps.expo.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS
        if: steps.expo.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish update
        if: steps.expo.outputs.has_token == 'true'
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          MESSAGE="${{ github.event.inputs.message }}"
          if [ -z "$CHANNEL" ]; then CHANNEL=preview; fi
          if [ -z "$MESSAGE" ]; then MESSAGE="OTA ${CHANNEL} $(git rev-parse --short HEAD)"; fi
          eas update --channel "$CHANNEL" --message "$MESSAGE" --non-interactive --platform android
