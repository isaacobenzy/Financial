name: EAS Web Hosting

# Export web + deploy to EAS Hosting (same EXPO_TOKEN pattern as Android APK builds).
# Shareable URL:
#   staging / preview → https://<subdomain>--preview.expo.app/
#   main / production → https://<subdomain>.expo.app/
# Docs: https://docs.expo.dev/eas/hosting/get-started/

on:
  workflow_dispatch:
    inputs:
      environment:
        description: preview or production (EAS Hosting alias)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - staging

concurrency:
  group: eas-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Export web & eas deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked. On your machine run:"
            echo "  npx eas-cli@latest login"
            echo "  npx eas-cli@latest init"
            echo "Commit the projectId written into app.json, then re-run this workflow."
            exit 1
          fi

      - name: Export web
        run: pnpm run export:web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to EAS Hosting
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ENV=production
            else
              ENV=preview
            fi
          fi
          echo "Deploying as: $ENV"
          if [ "$ENV" = "production" ]; then
            eas deploy --non-interactive --prod
          else
            eas deploy --non-interactive --alias preview
          fi
