name: EAS Web Hosting

# Deploys the Expo web export to EAS Hosting (shareable preview URL).
# Docs: https://docs.expo.dev/eas/hosting/get-started/

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: eas-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Export web & eas deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            echo "Create one at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked. On your machine run:"
            echo "  npx eas-cli@latest login"
            echo "  npx eas-cli@latest init"
            echo "Commit the projectId written into app.json, then re-run this workflow."
            exit 1
          fi

      - name: Export web
        run: pnpm export:web

      - name: Deploy to EAS Hosting
        run: eas deploy --non-interactive --prod
