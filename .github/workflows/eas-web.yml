name: EAS Web Hosting

# Deploys the Expo web export to EAS Hosting (shareable https://….expo.app URL).
# Docs: https://docs.expo.dev/eas/hosting/get-started/
#
# - push to staging → stable preview alias
# - push to main → production alias (--prod)
# - PRs: skip when EXPO_TOKEN is unavailable (do not fail the PR check)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: preview or production
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: eas-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Export web & eas deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for EXPO_TOKEN
        id: expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available in this run."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Skipping web deploy on PR (secret not exposed or not configured)."
            else
              echo "::error::Missing EXPO_TOKEN repository secret for deploy on ${{ github.ref_name }}."
              echo "Create one at https://expo.dev/settings/access-tokens"
              exit 1
            fi
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: steps.expo.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS
        if: steps.expo.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        if: steps.expo.outputs.has_token == 'true'
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked. On your machine run:"
            echo "  npx eas-cli@latest login"
            echo "  npx eas-cli@latest init"
            echo "Commit the projectId written into app.json, then re-run this workflow."
            exit 1
          fi

      - name: Export web
        if: steps.expo.outputs.has_token == 'true'
        run: pnpm run export:web

      - name: Deploy to EAS Hosting
        if: steps.expo.outputs.has_token == 'true'
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ENV=production
            else
              ENV=preview
            fi
          fi
          echo "Deploying as: $ENV"
          if [ "$ENV" = "production" ]; then
            eas deploy --non-interactive --prod
          else
            eas deploy --non-interactive --alias preview
          fi
