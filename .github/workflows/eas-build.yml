name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
  push:
    branches:
      - main

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Trigger EAS Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            echo "Create one at https://expo.dev/settings/access-tokens"
            echo "then add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked. On your machine run:"
            echo "  npx eas-cli@latest login"
            echo "  npx eas-cli@latest init"
            echo "Commit the projectId written into app.json, then re-run this workflow."
            exit 1
          fi

      # Android only — no Apple Developer account required.
      # See: https://docs.expo.dev/tutorial/eas/internal-distribution-builds/
      - name: Build Android on EAS
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: >
          eas build
          --platform android
          --profile ${{ github.event.inputs.profile || 'preview' }}
          --non-interactive
          --no-wait
