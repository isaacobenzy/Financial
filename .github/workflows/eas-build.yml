name: EAS Build (optional)

# Optional GitHub Actions trigger for Android APK builds.
# Primary path: .eas/workflows/android-preview-build.yml / build.yml
# (EAS Workflows run as the linked Expo project — no GitHub EXPO_TOKEN).
#
# This workflow only runs on manual dispatch and needs
# repo secret EXPO_TOKEN if you choose to use it.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Trigger EAS Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require EXPO_TOKEN for GitHub Actions path
        id: expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub Actions secret EXPO_TOKEN — skipping."
            echo "Android APKs are built by EAS Workflows (.eas/workflows/) without this secret."
            echo "To use this optional Actions path, add EXPO_TOKEN under Repo → Settings → Secrets → Actions."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: steps.expo.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS
        if: steps.expo.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        if: steps.expo.outputs.has_token == 'true'
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked in app.json"
            exit 1
          fi

      - name: Build Android on EAS
        if: steps.expo.outputs.has_token == 'true'
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: >
          eas build
          --platform android
          --profile ${{ github.event.inputs.profile || 'preview' }}
          --non-interactive
          --no-wait
