name: Security scan

# Free checks on every PR (security checklist E9): secret scan + production dependency audit.
# Blocks on leaked secrets and on critical advisories. High advisories are reported here;
# tighten AUDIT_BLOCK_LEVEL to "high" once the remaining transitive highs are fixed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0
  AUDIT_BLOCK_LEVEL: critical

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (PR commits only, values redacted)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --log-opts="origin/${{ github.base_ref }}..HEAD"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ["."]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production dependency audit
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm audit --prod --audit-level "$AUDIT_BLOCK_LEVEL"
            pnpm audit --prod --audit-level high || echo "::warning::High-severity advisories remain in production dependencies"
          else
            npm audit --omit=dev --package-lock-only --audit-level="$AUDIT_BLOCK_LEVEL"
            npm audit --omit=dev --package-lock-only --audit-level=high || echo "::warning::High-severity advisories remain in production dependencies"
          fi
