name: Deploy Web

# Optional GitHub Actions path for EAS Hosting (uses secrets.EXPO_TOKEN).
# Prefer EAS Workflows (.eas/workflows/deploy-web-*.yml) when the Expo GitHub
# integration is linked — those run as the project and do not need this secret.
#
# Flow:
#   1. Push / workflow_dispatch
#   2. Checkout
#   3. Authenticate EAS CLI via expo/expo-github-action + secrets.EXPO_TOKEN
#   4. pnpm export:web → static site in dist/
#   5. eas deploy --non-interactive → preview URL (or --prod on main)
#
# Shareable URL is from eas deploy (Hosting), not from publish-preview-update.yml
# (that file is EAS Update / OTA for installed APKs only).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: preview or production (EAS Hosting)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Export web & eas deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked. On your machine run:"
            echo "  npx eas-cli@latest login"
            echo "  npx eas-cli@latest init"
            echo "Commit the projectId written into app.json, then re-run this workflow."
            exit 1
          fi

      - name: Export web
        run: pnpm run export:web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to EAS Hosting
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ENV=production
            else
              ENV=preview
            fi
          fi
          echo "Deploying as: $ENV"
          if [ "$ENV" = "production" ]; then
            eas deploy --non-interactive --prod
          else
            # Preview hosting (not --prod) + stable alias for sharing
            eas deploy --non-interactive --alias preview
          fi
