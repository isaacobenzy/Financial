name: Deploy Web (optional)

# Optional GitHub Actions path for EAS Hosting (needs secrets.EXPO_TOKEN).
#
# Primary path — no GitHub secret:
#   .eas/workflows/deploy-web-preview.yml  → type: deploy, prod: false
#   .eas/workflows/deploy-web-production.yml → type: deploy, prod: true
#
# Those EAS Workflows run as the linked Expo project and emit the shareable
# https://….expo.app preview URL. This Actions workflow is manual-only.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: preview or production (EAS Hosting)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Export web & eas deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require EXPO_TOKEN for GitHub Actions path
        id: expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GitHub Actions secret EXPO_TOKEN — skipping."
            echo "Web preview URLs come from EAS Workflows (deploy-web-preview.yml), not this job."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: steps.expo.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup EAS
        if: steps.expo.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Ensure EAS project is linked
        if: steps.expo.outputs.has_token == 'true'
        run: |
          if ! node -e "const a=require('./app.json'); if(!a.expo?.extra?.eas?.projectId) process.exit(1)"; then
            echo "EAS project not linked in app.json"
            exit 1
          fi

      - name: Export web
        if: steps.expo.outputs.has_token == 'true'
        run: pnpm run export:web

      - name: Upload web build artifact
        if: steps.expo.outputs.has_token == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to EAS Hosting
        if: steps.expo.outputs.has_token == 'true'
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [ -z "$ENV" ]; then
            ENV=preview
          fi
          echo "Deploying as: $ENV"
          if [ "$ENV" = "production" ]; then
            eas deploy --non-interactive --prod
          else
            eas deploy --non-interactive --alias preview
          fi
