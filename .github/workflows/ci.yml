name: CI Verify

on:
  pull_request:
    branches:
      - features
      - staging
      - main
  push:
    branches:
      - features
      - staging
      - main

# Read-only: this workflow verifies the app and never deploys, publishes OTA updates, or builds binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, doctor, typecheck, lint, test, web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Doctor
        run: pnpm run doctor

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:ci

      - name: Web export check
        run: pnpm run build:ci
