# EAS Update (OTA JS) for installed preview/dev APKs — NOT a public web URL.
# Shareable browser preview comes from deploy-web-preview.yml / eas deploy.
#
# Channel must match eas.json build.preview.channel ("preview").
# Manual: pnpm update:preview

name: Publish Preview Update

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: '20.19.4'

jobs:
  publish_preview_update:
    name: Publish preview update
    type: update
    environment: preview
    params:
      branch: preview
      platform: android
      message: Preview OTA update for Financial Copilot APK testers
