# Publishes an EAS Update for installed preview APKs (JS-only OTA).
# Runs after merge to staging / on demand — not on every PR sync, so a flaky
# Expo worker error does not block pull-request checks.
#
# Preview builds listen on eas.json channel "preview" (mapped to update branch
# "preview"). Manual: pnpm update:preview

name: Publish Preview Update

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: '20.19.4'

jobs:
  publish_preview_update:
    name: Publish preview update
    type: update
    environment: preview
    params:
      branch: preview
      platform: android
      message: Preview update for Financial Copilot testers
