name: Build

# Android-only EAS Workflow — no Apple Developer account required.
# Internal distribution (shareable install link):
# https://docs.expo.dev/tutorial/eas/internal-distribution-builds/

# Automatic preview APKs are started only by android-preview-build.yml.
# This file stays manual so a push to main does not build the same APK twice.
on:
  workflow_dispatch: {}

jobs:
  build_android_preview:
    name: Build Android Preview APK
    type: build
    params:
      platform: android
      profile: preview
